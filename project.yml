name: DockStudio
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DockStudio:
    type: application
    platform: macOS
    sources:
      - path: DockStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dockstudio.preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dock Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Dock Studio は、ゴミ箱の項目数を表示するため Finder に問い合わせます。"
        CODE_SIGNING_ALLOWED: NO
  DockStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DockStudioTests
    dependencies:
      - target: DockStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dockstudio.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
